[package]
name = "council"
version = "0.1.0"
edition = "2024"
# 1.87: `const fn` with the trait bounds clippy::missing_const_for_fn wants.
rust-version = "1.87"
description = "Multi-model deliberation panel as an MCP server: several LLMs debate a question across rounds, then a chair synthesises consensus."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NielsMooren/council"
keywords = ["mcp", "llm", "consensus", "agents", "deliberation"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "council"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
dirs = "6"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
url = "2.5"

[profile.release]
lto = "thin"
strip = true

# Strict lints per https://www.namtao.com/rust/
# Two purposes: teach the language, and stop panics at runtime.
# Prototyping with .unwrap() is fine *in tests* - see clippy.toml.
[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
# `start_paused` / `time::advance`: deterministic clock for the rate-limit and
# cache-TTL tests, so they need no sleeps and cannot be flaky.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
