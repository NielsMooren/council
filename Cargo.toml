[package]
name = "council"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-model deliberation panel as an MCP server: several LLMs debate a question across rounds, then a chair synthesises consensus."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NielsMooren/council"
keywords = ["mcp", "llm", "consensus", "agents", "deliberation"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "council"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
dirs = "6"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
